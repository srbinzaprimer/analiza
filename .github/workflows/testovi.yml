name: Testovi

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testovi:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Probni build sa primer katalogom
        run: node scripts/napravi.mjs --katalog test/primer-katalog.json --adresa https://primer.github.io/bolum/
